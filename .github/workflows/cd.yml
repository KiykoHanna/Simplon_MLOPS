name: CD

on:
  push:
    branches: [ "main" ]

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # API
      - name: Build API image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-api:latest ./app_api

      - name: Push API image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mlops-api:latest

      # FRONT
      - name: Build Front image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mlops-front:latest ./app_front

      - name: Push Front image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mlops-front:latest