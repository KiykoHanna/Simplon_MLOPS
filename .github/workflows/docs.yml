name: Build and Deploy Docs

on:
  push:
    branches:
      - main  # сборка при пуше в main

jobs:
  build-deploy-docs:
    runs-on: ubuntu-latest

    steps:
      # Клонируем репо
      - uses: actions/checkout@v3

      # Устанавливаем Python и зависимости
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: python -m pip install -r docs/requirements.txt sphinx sphinx-autodoc-typehints myst-parser furo

      # Собираем документацию
      - name: Build Docs
        run: |
          sphinx-build -b html docs/source docs/build

      # Деплой на GitHub Pages (ветка gh-pages)
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAGES_TOKEN }}
          publish_dir: ./docs/build
          # опционально: подпись коммита
          commit_message: "Auto deploy docs from docs.yml"